name: Build NORA Raspberry Pi image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nora-pi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check build scripts
        run: python3 -m unittest discover -s tests -p test_pi_build.py -v
      - name: Make room on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          available=$(df -B1 --output=avail . | tail -n 1)
          test "$available" -ge 21474836480
      - name: Prepare checksum-pinned assets
        run: |
          python3 scripts/pi/prepare.py
          python3 scripts/prepare-voice.py
      - name: Build native ARM64 Pi image and test local inference
        run: |
          docker build -t nora-pi-builder:trixie scripts/pi
          docker run --rm -v "$PWD:/work:ro" nora-pi-builder:trixie bash tests/run_pi_first_boot_smoke.sh
          docker run --rm --privileged -v "$PWD:/work" nora-pi-builder:trixie bash scripts/pi/build.sh
          docker run --rm --privileged -v "$PWD:/work:ro" nora-pi-builder:trixie bash scripts/pi/verify-image.sh
          cp RASPBERRY_PI.md dist/pi/README.md
          cd dist/pi
          sha256sum -c SHA256SUMS
      - name: Store Pi image and validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nora-pi5-arm64-${{ github.sha }}
          path: dist/pi/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
